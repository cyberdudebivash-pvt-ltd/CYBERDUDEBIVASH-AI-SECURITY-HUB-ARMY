# nginx reverse proxy for cyberdudebivash_army_backend.py (uvicorn on 127.0.0.1:8000)
#
# This is the BOOTSTRAP config: HTTP only, no TLS yet. Deploy this first,
# then run `certbot --nginx -d <domain>` on the VPS (see deploy/README.md).
# Certbot's nginx plugin edits this file in place to add the HTTPS server
# block and the HTTP->HTTPS redirect — hand-writing that block here isn't
# necessary and risks pointing at a cert that doesn't exist yet, which would
# make nginx refuse to start.
#
# ASSUMES this origin sits behind Cloudflare (confirmed during the commercial
# audit: both cyberdudebivash.in and army.cyberdudebivash.in resolve to
# Cloudflare's own IP range, 2606:4700::/32). Two things follow from that:
#
#   1. Set Cloudflare's SSL/TLS mode to "Full (strict)" once certbot has run —
#      never "Flexible" (leaves Cloudflare-to-origin traffic unencrypted) and
#      never plain "Full" (accepts a self-signed cert, weaker than it looks).
#   2. nginx must recover the REAL client IP from Cloudflare's
#      CF-Connecting-IP header via the realip module below — otherwise every
#      request nginx forwards looks like it came from Cloudflare's edge, and
#      the backend's per-IP rate limiter collapses into one shared bucket for
#      the entire internet (see cyberdudebivash-api.service for the matching
#      uvicorn-side fix; both halves are required).
#
# Cloudflare's IP ranges below are their published list as of this writing
# (https://www.cloudflare.com/ips/) — reverify against that URL before
# relying on this in production; Cloudflare updates it occasionally.

# --- Cloudflare IPv4 ranges ---
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
# --- Cloudflare IPv6 ranges ---
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;

real_ip_header CF-Connecting-IP;

server {
    listen 80;
    listen [::]:80;
    server_name api.cyberdudebivash.in;  # CHANGE if you choose a different origin hostname

    client_max_body_size 1m;  # matches the backend's own oversized-payload posture

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }
}
