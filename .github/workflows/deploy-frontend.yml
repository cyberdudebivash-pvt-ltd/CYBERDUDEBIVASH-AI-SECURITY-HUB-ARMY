name: Deploy Frontend to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Stage public assets only
        # Publish only the customer-facing marketing pages. Do NOT widen this to
        # the whole repo root — it previously published backend source, deploy
        # scripts, the test suite, and a local Cloudflare account-cache file to
        # a public URL on every push (see docs/commercial/COMMERCIAL_PRODUCTION_GAP_REGISTER.md, GAP-004).
        run: |
          mkdir -p _site
          cp index.html _site/
          cp -r ecosystem _site/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
