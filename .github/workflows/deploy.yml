name: Deploy ARMY v185.1

on:
  push:
    branches: [main, hotfix/*]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Run validation suite
        run: python test_hotfix.py

  deploy-worker:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - name: Validate secrets
        run: |
          if [ -z "${{ secrets.CF_API_TOKEN }}" ]; then
            echo "❌ Secret CF_API_TOKEN is missing."
            exit 1
          fi
          if [ -z "${{ secrets.CF_ACCOUNT_ID }}" ]; then
            echo "❌ Secret CF_ACCOUNT_ID is missing."
            exit 1
          fi
          echo "✅ Cloudflare secrets validated"
      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          workingDirectory: "worker"

  deploy-backend:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Backend deploy reminder
        run: |
          echo "=========================================="
          echo "⚠️  MANUAL BACKEND DEPLOY REQUIRED"
          echo "=========================================="
          echo "Your live API (cyberdudebivash.in) still runs OLD code."
          echo "SSH into your server and restart with the new backend file."
          echo "=========================================="
